# Postgres para DESENVOLVIMENTO LOCAL e TESTES apenas.
# Credenciais postgres/postgres são placeholders INSEGUROS de uso local —
# nunca use estes valores em produção.
name: pluton-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres # insecure local-only dev value
      POSTGRES_PASSWORD: postgres # insecure local-only dev value
      POSTGRES_DB: pluton
    ports:
      - "5433:5432"
    volumes:
      - pluton-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pluton"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pluton-pgdata:
